<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1440" viewBox="0 0 1440 1440" role="img" aria-labelledby="title desc"><title id="title">Light Panel — feature overview</title><desc id="desc">Twelve areas: photos, energy, battery, appliances, climate, weather, calendar, notifications, home alerts, controls, cameras and frame management. Features depend on your own integrations and hardware.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07121e"/><stop offset="1" stop-color="#122338"/></linearGradient><radialGradient id="glow"><stop stop-color="#22d9b3" stop-opacity=".22"/><stop offset="1" stop-color="#22d9b3" stop-opacity="0"/></radialGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#eff6fa}.eyebrow{fill:#70dfc7;font-size:18px;letter-spacing:3px}.heading{font-size:58px;font-weight:700}.subtitle{font-size:24px;fill:#bdceda}.card-title{font-size:24px;font-weight:700}.tagline{font-size:21px;fill:#76dfcb}.detail{font-size:18px;fill:#bdceda}.num{font-size:16px;fill:#6acdbb}</style><rect width="1440" height="1440" rx="28" fill="url(#bg)"/><ellipse cx="1110" cy="140" rx="480" ry="300" fill="url(#glow)"/><rect x="16" y="16" width="1408" height="1408" rx="23" fill="none" stroke="#46c7ad" stroke-opacity=".35"/><text x="60" y="70" class="eyebrow">LIGHT PANEL · FEATURE OVERVIEW</text><text x="60" y="150" class="heading">More than a photo frame.</text><text x="60" y="195" class="subtitle">Your photos in focus. Your home within reach.</text><text x="60" y="235" class="detail">An open starting point for your tablet, photo frame or browser.</text>
<rect x="60" y="280" width="424" height="222" rx="18" fill="#192d3f" stroke="#365065"/>
<text x="84" y="313" class="num">01</text>
<text x="84" y="356" class="card-title">Photos &amp; home</text>
<text x="84" y="394" class="tagline">Your photos in focus.</text>
<text x="84" y="437" class="detail">Photo rotation and full-screen mode.</text>
<text x="84" y="467" class="detail">Clock and date from the server.</text>
<rect x="504" y="280" width="424" height="222" rx="18" fill="#192d3f" stroke="#365065"/>
<text x="528" y="313" class="num">02</text>
<text x="528" y="356" class="card-title">Energy &amp; Tibber</text>
<text x="528" y="394" class="tagline">Know what electricity costs.</text>
<text x="528" y="437" class="detail">Day, week, month and year.</text>
<text x="528" y="467" class="detail">Costs, export revenue and net insight.</text>
<rect x="948" y="280" width="424" height="222" rx="18" fill="#192d3f" stroke="#365065"/>
<text x="972" y="313" class="num">03</text>
<text x="972" y="356" class="card-title">Battery &amp; solar</text>
<text x="972" y="394" class="tagline">See your energy reserve.</text>
<text x="972" y="437" class="detail">Charge, power and usable reserve.</text>
<text x="972" y="467" class="detail">Solar forecast and Victron planning.</text>
<rect x="60" y="525" width="424" height="222" rx="18" fill="#192d3f" stroke="#365065"/>
<text x="84" y="558" class="num">04</text>
<text x="84" y="601" class="card-title">Appliance energy</text>
<text x="84" y="639" class="tagline">Where does the power go?</text>
<text x="84" y="682" class="detail">Current power for each appliance.</text>
<text x="84" y="712" class="detail">Daily totals and measurement charts.</text>
<rect x="504" y="525" width="424" height="222" rx="18" fill="#192d3f" stroke="#365065"/>
<text x="528" y="558" class="num">05</text>
<text x="528" y="601" class="card-title">Climate &amp; comfort</text>
<text x="528" y="639" class="tagline">How does your home feel?</text>
<text x="528" y="682" class="detail">Temperature, hot water and CO₂.</text>
<text x="528" y="712" class="detail">Thermostats, air conditioning and fans.</text>
<rect x="948" y="525" width="424" height="222" rx="18" fill="#192d3f" stroke="#365065"/>
<text x="972" y="558" class="num">06</text>
<text x="972" y="601" class="card-title">Weather, sun &amp; moon</text>
<text x="972" y="639" class="tagline">A glance outside.</text>
<text x="972" y="682" class="detail">Weather and animated forecasts.</text>
<text x="972" y="712" class="detail">Sun and moon times when available.</text>
<rect x="60" y="770" width="424" height="222" rx="18" fill="#192d3f" stroke="#365065"/>
<text x="84" y="803" class="num">07</text>
<text x="84" y="846" class="card-title">Calendar &amp; countdowns</text>
<text x="84" y="884" class="tagline">What is coming up?</text>
<text x="84" y="927" class="detail">Calendar colours and filters.</text>
<text x="84" y="957" class="detail">Count down to special moments.</text>
<rect x="504" y="770" width="424" height="222" rx="18" fill="#192d3f" stroke="#365065"/>
<text x="528" y="803" class="num">08</text>
<text x="528" y="846" class="card-title">Notification feed</text>
<text x="528" y="884" class="tagline">Attention when it matters.</text>
<text x="528" y="927" class="detail">Stack, filter and swipe notifications.</text>
<text x="528" y="957" class="detail">Details and history after dismissal.</text>
<rect x="948" y="770" width="424" height="222" rx="18" fill="#192d3f" stroke="#365065"/>
<text x="972" y="803" class="num">09</text>
<text x="972" y="846" class="card-title">Home alerts</text>
<text x="972" y="884" class="tagline">From doorbell to laundry.</text>
<text x="972" y="927" class="detail">Large alerts with icons or a camera.</text>
<text x="972" y="957" class="detail">Ventilation, faults and charging advice.</text>
<rect x="60" y="1015" width="424" height="222" rx="18" fill="#192d3f" stroke="#365065"/>
<text x="84" y="1048" class="num">10</text>
<text x="84" y="1091" class="card-title">Lights &amp; media</text>
<text x="84" y="1129" class="tagline">Controls within reach.</text>
<text x="84" y="1172" class="detail">Lights on your own floor plan.</text>
<text x="84" y="1202" class="detail">Media and actions via Home Assistant.</text>
<rect x="504" y="1015" width="424" height="222" rx="18" fill="#192d3f" stroke="#365065"/>
<text x="528" y="1048" class="num">11</text>
<text x="528" y="1091" class="card-title">Cameras, news &amp; sites</text>
<text x="528" y="1129" class="tagline">Keep an eye on the rest.</text>
<text x="528" y="1172" class="detail">Camera snapshots and garage PiP.</text>
<text x="528" y="1202" class="detail">News and your website status.</text>
<rect x="948" y="1015" width="424" height="222" rx="18" fill="#192d3f" stroke="#365065"/>
<text x="972" y="1048" class="num">12</text>
<text x="972" y="1091" class="card-title">Remote frame controls</text>
<text x="972" y="1129" class="tagline">Everything at hand.</text>
<text x="972" y="1172" class="detail">Screen, LEDs, sound and messages.*</text>
<text x="972" y="1202" class="detail">Webhooks for your own automations.</text>
<text x="60" y="1304" class="subtitle">Your home. Your screen. Your version.</text><text x="60" y="1340" class="detail">Features depend on your own settings, sensors and integrations.</text><text x="60" y="1370" class="detail">* Screen and LED controls require supported hardware and the matching Android app.</text><text x="60" y="1400" class="detail">Home Assistant · Tibber · Victron · GNU GPLv3</text></svg>